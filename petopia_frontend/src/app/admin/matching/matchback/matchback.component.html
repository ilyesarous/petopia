<div style="max-width: 1280px; margin: 0 auto; padding: 2rem; background: linear-gradient(to bottom right, #FEF3E7, #FFF3F5, #FFE6F0); min-height: 100vh;">
    <!-- Main Heading -->
    <h1 style="font-size: 2.25rem; font-weight: 800; color: #FF617C; margin-bottom: 3rem; text-align: center; letter-spacing: -0.025em;">Petopia Match Statistics</h1>
  
    <!-- Loading Spinner -->
    <div *ngIf="loading" style="text-align: center; padding: 3rem 0;">
      <div style="display: inline-block; border-radius: 50%; height: 4rem; width: 4rem; border: 4px solid rgba(248, 49, 130, 0.8); border-top-color: #F83182; border-right-color: #F83182; animation: spin 1s linear infinite; margin: 0 auto;"></div>
      <p style="color: #F83182; margin-top: 1rem; font-size: 1.125rem; font-weight: 500;">Loading statistics...</p>
    </div>
  
    <!-- Error Message -->
    <div *ngIf="error && !loading" style="color: #FF617C; text-align: center; padding: 1.5rem; background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border: 1px solid #FFCCD5; max-width: 32rem; margin: 0 auto;">
      {{ error }}
    </div>
  
    <!-- Charts -->
    <div *ngIf="!loading && !error" style="display: personally; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem;">
      <!-- Breed Chart -->
      <div style="background: white; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border: 1px solid #FFE6F0; transition: box-shadow 0.3s;">
        <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
          <img src="/assets/images/logo.png" alt="Petopia Logo" style="height: 32px; width: auto; margin-right: 0.5rem;" />
          <h2 style="font-size: 1.5rem; font-weight: 600; color: #F472B6;">Matches by Breed</h2>
        </div>
        <div style="position: relative; width: 100%; height: 400px; overflow: hidden; border-radius: 0.5rem;">
          <apx-chart
            [series]="breedChartOptions.series"
            [chart]="breedChartOptions.chart"
            [xaxis]="breedChartOptions.xaxis"
            [yaxis]="breedChartOptions.yaxis"
            [plotOptions]="breedChartOptions.plotOptions"
            [dataLabels]="breedChartOptions.dataLabels"
            [title]="breedChartOptions.title"
          ></apx-chart>
        </div>
      </div>
  
      <!-- Species Chart -->
      <div style="background: white; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border: 1px solid #FFE6E8; transition: box-shadow 0.3s;">
        <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
          <img src="/assets/images/logo.png" alt="Petopia Logo" style="height: 32px; width: auto; margin-right: 0.5rem;" />
          <h2 style="font-size: 1.5rem; font-weight: 600; color: #FE9A7A;">Matches by Species</h2>
        </div>
        <div style="position: relative; width: 100%; height: 400px; overflow: hidden; border-radius: 0.5rem;">
          <apx-chart
            [series]="speciesChartOptions.series"
            [chart]="speciesChartOptions.chart"
            [labels]="speciesChartOptions.labels || []"
            [title]="speciesChartOptions.title"
            [responsive]="speciesChartOptions.responsive"
          ></apx-chart>
        </div>
      </div>
  
      <!-- Age Group Chart -->
      <div style="background: white; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border: 1px solid #FEF3E7; transition: box-shadow 0.3s; grid-column: span 1;">
        <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
          <img src="/assets/images/logo.png" alt="Petopia Logo" style="height: 32px; width: auto; margin-right: 0.5rem;" />
          <h2 style="font-size: 1.5rem; font-weight: 600; color: #FF617C;">Matches by Age Group</h2>
        </div>
        <div style="position: relative; width: 100%; height: 400px; overflow: hidden; border-radius: 0.5rem;">
          <apx-chart
            [series]="ageChartOptions.series"
            [chart]="ageChartOptions.chart"
            [xaxis]="ageChartOptions.xaxis"
            [yaxis]="ageChartOptions.yaxis"
            [plotOptions]="ageChartOptions.plotOptions"
            [dataLabels]="ageChartOptions.dataLabels"
            [title]="ageChartOptions.title"
          ></apx-chart>
        </div>
      </div>
    </div>
  </div>
