<div *ngIf="showDeleteSuccess" class="alert alert-success success-alert">
  <i class="bi bi-check-circle me-2"></i> Deleted successfully!
</div>

<!-- Community Container -->
<div class="community-container">
  <div class="header-row d-flex justify-content-between align-items-center mb-4 flex-wrap">
    <h2 class="title mb-2 mb-md-0">Community Overview</h2>
    <div class="search-box">
      <input
        type="text"
        class="form-control"
        placeholder="Search by user name, content, or type"
        [(ngModel)]="searchQuery"
        (input)="applySearchFilter()"
      />
    </div>
  </div>

  <!-- Posts Section -->
  <div class="section">
    <h4>Posts</h4>
    <div *ngFor="let post of paginatedPosts" class="entry-row">
      <div class="post-info">
        <div class="post-content-truncate">{{ post.content }}</div>
        <small class="text-muted ms-2">by {{ post.user?.name }}</small>
      </div>
      <div class="actions">
        <button class="btn view-btn" (click)="viewDetails('post', post.id)">View</button>
        <button class="btn delete-btn" (click)="deletePost(post.id)">Delete</button>
      </div>
    </div>
    
  </div>

  <!-- Posts Pagination -->
  <div class="pagination-controls text-center mt-4" *ngIf="totalPostPages > 1">
    <button class="btn btn-sm mx-1" [disabled]="currentPostPage === 1" (click)="changePostPage(currentPostPage - 1)">Prev</button>
    <button
      *ngFor="let page of postPageNumbers"
      class="btn btn-sm mx-1"
      [class.active]="currentPostPage === page"
      (click)="changePostPage(page)">
      {{ page }}
    </button>
    <button class="btn btn-sm mx-1" [disabled]="currentPostPage === totalPostPages" (click)="changePostPage(currentPostPage + 1)">Next</button>
  </div>

  <!-- Stories Section -->
  <div class="section">
    <h4>Stories</h4>
    <div *ngFor="let story of paginatedStories" class="entry-row">
      <div>{{ story.user.name }} - {{ story.createdAt | date }}</div>
      <div class="actions">
        <button class="btn view-btn" (click)="viewDetails('story', story.id)">View</button>
        <button class="btn delete-btn" (click)="deleteStory(story.id)">Delete</button>
      </div>
    </div>
  </div>

  <!-- Stories Pagination -->
  <div class="pagination-controls text-center mt-4" *ngIf="totalStoryPages > 1">
    <button class="btn btn-sm mx-1" [disabled]="currentStoryPage === 1" (click)="changeStoryPage(currentStoryPage - 1)">Prev</button>
    <button
      *ngFor="let page of storyPageNumbers"
      class="btn btn-sm mx-1"
      [class.active]="currentStoryPage === page"
      (click)="changeStoryPage(page)">
      {{ page }}
    </button>
    <button class="btn btn-sm mx-1" [disabled]="currentStoryPage === totalStoryPages" (click)="changeStoryPage(currentStoryPage + 1)">Next</button>
  </div>
</div>
