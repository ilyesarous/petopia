<div class="shelter-list-container">
    <!-- Alerts -->
    <div *ngIf="showSuccessAlert" class="alert alert-success alert-dismissible fade show success-alert" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      Shelter deleted successfully.
    </div>
    <div *ngIf="showErrorAlert" class="alert alert-danger alert-dismissible fade show success-alert" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      An error occurred while deleting the shelter.
    </div>
  
    <!-- Search -->
    <div class="header-row d-flex justify-content-between align-items-center mb-4 flex-wrap">
        <h2 class="title mb-2 mb-md-0">Shelters</h2>
        <div class="search-box">
          <input
            type="text"
            class="form-control"
            placeholder="Search by name, email, phone or website"
            [(ngModel)]="searchQuery"
            (input)="applyFilter()"
          />
        </div>
      </div>
      
  
    <!-- Table Headers -->
    <div class="table-header">
      <div class="col shelter-col">Shelter</div>
      <div class="col email-col">Email</div>
      <div class="col phone-col">Phone</div>
      <div class="col location-col">Location</div>
    </div>
  
    <!-- Table Rows -->
    <div class="table-row" *ngFor="let shelter of paginatedShelters">
      <div class="col shelter-col shelter-info">
        <img *ngIf="shelter.logoUrl" [src]="shelter.logoUrl" alt="Logo" class="shelter-logo" />
        <span class="shelter-name">{{ shelter.shelter_name }}</span>
      </div>
      <div class="col email-col">{{ shelter.email }}</div>
      <div class="col phone-col">{{ shelter.phone_number }}</div>
      <div class="col location-col actions">
        <span class="shelter-location">{{ shelter.location }}</span>
        <div class="button-group">
          <button class="btn view-btn" (click)="viewShelterDetails(shelter.id_shelter)">View</button>
          <button class="btn delete-btn" (click)="deleteShelter(shelter.id_shelter)">Delete</button>
        </div>
      </div>
    </div>
  
    <!-- Pagination -->
    <div class="pagination-controls text-center mt-4" *ngIf="totalPages > 1">
      <button class="btn btn-sm mx-1" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
        Prev
      </button>
  
      <button
        *ngFor="let page of pageNumbers"
        class="btn btn-sm mx-1"
        [class.active]="currentPage === page"
        (click)="changePage(page)">
        {{ page }}
      </button>
  
      <button class="btn btn-sm mx-1" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
        Next
      </button>
    </div>
  </div>
