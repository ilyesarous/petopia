      <div class="dashboard-layout">
        <!-- Graphique des notifications à gauche -->
        <div class="graph-container">
          <app-notification-stats
            [seenCount]="seenCount"
            [unseenCount]="unseenCount">
          </app-notification-stats>
        </div>

        <!-- Carrés de statistiques à droite -->
        <div class="stats-container">
          <div class="dashboard-card" routerLink="/dashboard/notifications">
            <p>{{"🔔"}}</p>
            <h3>Notifications</h3>
            <p>{{ totalNotifications }}</p>
          </div>
          <div class="dashboard-card" routerLink="/dashboard/diagnosis">
            <p>{{"🩺"}}</p>
            <h3>Diagnoses</h3>
            <p>{{ totalDiagnoses }}</p>
          </div>
          <div class="dashboard-card" routerLink="/dashboard/pet-growth">
            <p>{{"🐾 📈"}}</p>
            <h3>Pet Growths</h3>
            <p>{{ totalPetGrowths }}</p>
          </div>
          <div class="dashboard-card" routerLink="/dashboard/consultations">
            <p>{{"🐶👩‍⚕️"}}</p>
            <h3>Consultations</h3>
            <p>{{ totalConsultations }}</p>
          </div>
        </div>
      </div>

      <br>
      <br>

      <app-app-dog-breed-recognition-redirect-button></app-app-dog-breed-recognition-redirect-button>

      <br>
      <br>

      <button routerLink="/dashboard/tic-tac-toe">Tic Tac Toe Game 🎮</button>

      <br>
      <br>

      <app-qr-scanner></app-qr-scanner>

      <app-chatbot></app-chatbot>
