<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2">
      <app-sidebar></app-sidebar>
    </div>
    <!-- Navbar and Content -->
    <div class="col-md-10">
      <app-navbar-admin></app-navbar-admin>
            
      <div class="dashboard-layout">
        <!-- Graphique des notifications à gauche -->
        <div class="graph-container">
          <app-notification-stats
            [seenCount]="seenCount"
            [unseenCount]="unseenCount">
          </app-notification-stats>
        </div>

        <!-- Carrés de statistiques à droite -->
        <div class="stats-container">
          <div class="dashboard-card" routerLink="/notifications">
            <p>{{"🔔"}}</p>
            <h3>Notifications</h3>
            <p>{{ totalNotifications }}</p>
          </div>
          <div class="dashboard-card" routerLink="/diagnosis">
            <p>{{"🩺"}}</p>
            <h3>Diagnoses</h3>
            <p>{{ totalDiagnoses }}</p>
          </div>
          <div class="dashboard-card" routerLink="/pet-growth">
            <p>{{"🐾 📈"}}</p>
            <h3>Pet Growths</h3>
            <p>{{ totalPetGrowths }}</p>
          </div>
          <div class="dashboard-card" routerLink="/consultations">
            <p>{{"🐶👩‍⚕️"}}</p>
            <h3>Consultations</h3>
            <p>{{ totalConsultations }}</p>
          </div>
        </div>
      </div>

      <br>
      <br>

      <app-app-dog-breed-recognition-redirect-button></app-app-dog-breed-recognition-redirect-button>

      <br>
      <br>

      <button routerLink="/tic-tac-toe">Tic Tac Toe Game 🎮</button>

      <br>
      <br>

      <app-qr-scanner></app-qr-scanner>

      <app-chatbot></app-chatbot>

    </div>
  </div>
</div>
