<div class="popup-container">
    <div class="popup-header">
      <h2 class="popup-title">Add New Advertisement</h2>
      <button class="close-btn" (click)="closePopup()">&times;</button>
    </div>
  
    <form [formGroup]="adForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" formControlName="title" class="form-control">
      </div>
  
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" class="form-control" rows="3"></textarea>
      </div>
  
      <div class="form-group">
        <label for="image">Advertisement Image *</label>
        <input type="file" id="image" class="form-control" accept="image/*" (change)="onFileSelected($event)" required>
        
        <div *ngIf="previewUrl" class="image-preview-container">
          <img [src]="previewUrl" alt="Preview" class="image-preview">
        </div>
      </div>
  
      <div class="date-row">
        <div class="form-group">
          <label for="startDate">Start Date *</label>
          <input type="date" id="startDate" formControlName="startDate" class="form-control">
        </div>
  
        <div class="form-group">
          <label for="endDate">End Date *</label>
          <input type="date" id="endDate" formControlName="endDate" class="form-control">
        </div>
      </div>
  
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status" class="form-control">
          <option value="ACTIVE">Active</option>
          <option value="PENDING">Pending</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>
  
      <button type="submit" class="btn-submit" [disabled]="!adForm.valid || !selectedFile || isLoading">
        <span *ngIf="!isLoading">Create Advertisement</span>
        <span *ngIf="isLoading">Creating...</span>
      </button>
    </form>
  </div>
