<div class="sidebar">
  <div class="d-flex flex-row align-items-center gap-2">
    <img src="../../../assets/images/logo.png" alt="logo" width="50" />
    <h3>Petopia</h3>
  </div>
  <hr />
  <ul *ngFor="let item of items">
    <li
      class="selected"
      [ngClass]="{ isSelected: item.name === selectedItem }"
      (click)="selectedItem = item.name"
    >
      <a
              class="d-flex flex-row gap-2 align-items-center sidebar-link"
              [routerLink]="item.route"
              routerLinkActive="active"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.name }}</span>
      </a>
    </li>
  </ul>

  <!-- Logout Button (Conditional) -->
  <div class="sidebar-footer" *ngIf="isAuthenticated">
    <a
            class="d-flex flex-row gap-2 align-items-center sidebar-link logout-btn"
            routerLink="/"
            (click)="logout(); selectedItem = ''"
    >
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </a>
  </div>
</div>
