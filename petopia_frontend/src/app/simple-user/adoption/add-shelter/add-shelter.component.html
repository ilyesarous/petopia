<div class="shelter-container">
    <div class="shelter-card">
      <div class="shelter-header">
        <p>Tell us more about your shelter</p>
      </div>
  
      <form [formGroup]="shelterForm" (ngSubmit)="onSubmit()" class="shelter-form" enctype="multipart/form-data">
        <!-- Shelter Name -->
        <div class="form-group">
          <label for="shelter_name">Shelter Name <span class="required">*</span></label>
          <input type="text" formControlName="shelter_name" id="shelter_name"
                 [ngClass]="{'is-invalid': isFieldInvalid('shelter_name')}" placeholder="Enter shelter name">
          <div *ngIf="isFieldInvalid('shelter_name')" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Shelter name is required
          </div>
        </div>
  
        <!-- Location -->
        <div class="form-group">
          <label for="location">Location <span class="required">*</span></label>
          <input type="text" formControlName="location" id="location"
                 [ngClass]="{'is-invalid': isFieldInvalid('location')}" placeholder="City or address">
          <div *ngIf="isFieldInvalid('location')" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Location is required
          </div>
        </div>
  
        <!-- Email -->
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" formControlName="email" id="email"
                 [ngClass]="{'is-invalid': isFieldInvalid('email')}" placeholder="you@example.com">
          <div *ngIf="isFieldInvalid('email')" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Enter a valid email address
          </div>
        </div>
  
        <!-- Phone -->
        <div class="form-group">
          <label for="phone_number">Phone Number <span class="required">*</span></label>
          <input type="text" formControlName="phone_number" id="phone_number"
                 [ngClass]="{'is-invalid': isFieldInvalid('phone_number')}" placeholder="8-digit number">
          <div *ngIf="isFieldInvalid('phone_number')" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Phone must be 8 digits
          </div>
        </div>
  
        <!-- Description -->
        <div class="form-group">
          <label for="description">Description <span class="required">*</span></label>
          <textarea formControlName="description" id="description"
                    [ngClass]="{'is-invalid': isFieldInvalid('description')}" placeholder="Brief description"></textarea>
          <div *ngIf="isFieldInvalid('description')" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Minimum 10 characters required
          </div>
        </div>
  
        <!-- Website -->
        <div class="form-group">
          <label for="website">Website</label>
          <input type="url" formControlName="website" id="website" placeholder="https://example.com"
                 [ngClass]="{'is-invalid': isFieldInvalid('website')}">
          <div *ngIf="isFieldInvalid('website')" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Enter a valid website URL
          </div>
        </div>
  
        <!-- Logo Upload -->
        <div class="form-group logo-upload-group">
          <label for="logo">Shelter Logo <span class="required">*</span></label>
          <div class="custom-file-wrapper">
            <input #logoInput type="file" id="logo" (change)="onFileSelected($event)">
            <button type="button" class="custom-upload-btn" (click)="triggerLogoInput()">
              Choose Logo
            </button>
            <span class="file-name">{{ logoFile?.name || 'No file chosen' }}</span>
          </div>
          <div *ngIf="isLogoInvalid()" class="error-message">
            <i class="bi bi-exclamation-circle"></i> Logo is required
          </div>
  
          <!-- Logo Preview -->
          <div *ngIf="logoPreview" class="logo-preview">
            <img [src]="logoPreview" alt="Logo Preview">
          </div>
        </div>
  
        <!-- Submit -->
        <button class="signup-btn" type="submit" [disabled]="shelterForm.invalid || !logoFile">
          Add Shelter
        </button>
  
        <!-- Feedback -->
        <div *ngIf="errorMessage" class="error-message">
          <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
        </div>
  
        <div *ngIf="successMessage" class="success-message">
          <i class="bi bi-check-circle-fill"></i> {{ successMessage }}
        </div>
      </form>
    </div>
  </div>
