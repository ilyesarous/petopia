<nav class="navbar navbar-expand-lg" *ngIf="role !== 'ROLE_ADMIN'">
  <div class="container">
    <!-- Brand Logo -->
    <a class="navbar-brand" routerLink="/" (click)="reloadPage($event)">
      <img src="/assets/images/logo.png" alt="Petopia Logo" class="navbar-logo">
      <span class="brand-logo">Petopia</span>
    </a>

    <button class="navbar-toggler" type="button" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse" [ngClass]="{'show': isMobileMenuOpen}">
      <ul class="navbar-nav">

        <!-- Dynamic Pages for Authenticated Users -->
        <ng-container *ngIf="isAuthenticated && role === 'ROLE_USER'">
          <li class="nav-item" *ngFor="let page of pages">
            
            <div *ngIf="page.name === 'Events'" class="nav-item dropdown"
                 (mouseenter)="showEventsDropdown = true" (mouseleave)="showEventsDropdown = false">
              <a class="nav-link dropdown-toggle"
                 [routerLink]="page.link"
                 routerLinkActive="active"
                 (click)="selectedItem = page.name; $event.preventDefault()"
                 [ngClass]="{'is-selected': selectedItem === page.name}">
                {{ page.name }}
              </a>
              <div class="dropdown-menu" [ngClass]="{'show': showEventsDropdown}">
                <a class="dropdown-item"
                   routerLink="/events"
                   (click)="selectedItem = 'Events'">
                  All Events
                </a>
                <a class="dropdown-item"
                   routerLink="/services"
                   (click)="selectedItem = 'Services'">
                  Animal Services
                </a>
              </div>
            </div>

            <!-- Community dropdown -->
            <div *ngIf="page.name === 'Community'" class="nav-item dropdown"
                 (mouseenter)="showCommunityDropdown = true" (mouseleave)="showCommunityDropdown = false">
              <a class="nav-link dropdown-toggle"
                 href="#"
                 (click)="selectedItem = page.name; $event.preventDefault()"
                 [ngClass]="{'is-selected': selectedItem === page.name}">
                {{ page.name }}
              </a>
              <div class="dropdown-menu" [ngClass]="{'show': showCommunityDropdown}">
                <a class="dropdown-item"
                   routerLink="/community"
                   (click)="selectedItem = 'Hub'">
                  Hub
                </a>
                <a class="dropdown-item"
                   routerLink="/news"
                   (click)="selectedItem = 'News'">
                  News
                </a>
              </div>
            </div>

            <!-- Regular nav items -->
            <a *ngIf="page.name !== 'Events' && page.name !== 'Community'"
               class="nav-link"
               [routerLink]="page.link"
               routerLinkActive="active"
               (click)="selectedItem = page.name"
               [ngClass]="{'is-selected': selectedItem === page.name}">
              {{ page.name }}
            </a>
          </li>
        </ng-container>

        <!-- Dynamic Pages for Shelter Users -->
        <ng-container *ngIf="isAuthenticated && role === 'ROLE_SHELTER'">
          <li class="nav-item" *ngFor="let page of shelterPages">
            <a class="nav-link"
               [routerLink]="page.link"
               routerLinkActive="active"
               (click)="selectedItem = page.name"
               [ngClass]="{'is-selected': selectedItem === page.name}">
              {{ page.name }}
            </a>
          </li>
        </ng-container>

        <!-- Dynamic Pages for Partner Users -->
        <ng-container *ngIf="isAuthenticated && role === 'ROLE_PARTNER'">
          <li class="nav-item" *ngFor="let page of partnerPages">
            <a class="nav-link"
               [routerLink]="page.link"
               routerLinkActive="active"
               (click)="selectedItem = page.name"
               [ngClass]="{'is-selected': selectedItem === page.name}">
              {{ page.name }}
            </a>
          </li>
        </ng-container>

        <!-- Dynamic Pages for Vet Users -->
        <ng-container *ngIf="isAuthenticated && role === 'ROLE_VET'">
          <li class="nav-item" *ngFor="let page of VETpages">
            <a class="nav-link"
               [routerLink]="page.link"
               routerLinkActive="active"
               (click)="selectedItem = page.name"
               [ngClass]="{'is-selected': selectedItem === page.name}">
              {{ page.name }}
            </a>
          </li>
        </ng-container>

        <!-- Signup & Login (for guests) -->
        <li class="nav-item" *ngIf="!isAuthenticated">
          <a class="nav-link" routerLink="/signup" routerLinkActive="active" (click)="selectedItem = 'Sign up'">Sign up</a>
        </li>
        <li class="nav-item" *ngIf="!isAuthenticated">
          <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="selectedItem = 'Login'">Login</a>
        </li>

        <!-- Logout (for authenticated users) -->
        <li class="nav-item" *ngIf="isAuthenticated">
          <a class="nav-link" routerLink="/" (click)="logout(); selectedItem = ''">Logout</a>
        </li>

        <!-- User Dropdown Menu -->
        <li class="nav-item dropdown" *ngIf="isAuthenticated">
          <a class="nav-link dropdown-toggle" (click)="toggleDropdown()">
            <i class="fas fa-user-circle user-icon"></i>
            <span class="username">{{ username }}</span>
          </a>
          <div class="dropdown-menu" [ngClass]="{'show': isDropdownOpen}">
            <a class="dropdown-item" routerLink="/profileUser" (click)="selectedItem = 'Profile'">
              <i class="fas fa-user" style="color: #F83182;"></i> Profile
            </a>
            <a class="dropdown-item" routerLink="shelter/info" (click)="selectedItem = ' Shelter Infos'" *ngIf="role === 'ROLE_SHELTER'">
              <i class="bi bi-house-heart-fill" style="color: #F83182;"></i> Shelter Info
            </a>
            <a class="dropdown-item" routerLink="/pet" (click)="selectedItem = 'Add Pet'" *ngIf="role === 'ROLE_USER'">
              <i class="fas fa-paw" style="color: #F83182;"></i> Add Pet
            </a>
            <a class="dropdown-item" routerLink="/ListPets" (click)="selectedItem = 'My Pets'" *ngIf="role === 'ROLE_USER'">
              <i class="fas fa-list" style="color: #F83182;"></i> My Pets
            </a>
            <a class="dropdown-item" routerLink="/ListReclamationFront" (click)="selectedItem = 'My Requests'"  *ngIf="role === 'ROLE_USER'">
              <i class="fas fa-comment-alt" style="color: #F83182;"></i> My Requests
            </a>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
