<div class="event-form-container">
  <h2>Participer à un événement</h2>
  
  <!-- Show warning if already participating -->
  <div *ngIf="alreadyParticipating" class="alert alert-warning">
    Vous êtes déjà inscrit à cet événement.
  </div>

  <form (ngSubmit)="onSubmit()" *ngIf="!alreadyParticipating">
    <!-- Rest of your form -->
    <div class="form-group">
      <label for="dateInscription">Date d'inscription :</label>
      <input id="dateInscription" [value]="participation.dateInscription | date:'short'" readonly />
    </div>

    <div class="form-group">
      <label for="event">Événement :</label>
      <input id="event" [value]="eventDetails?.nameEvent" readonly />
    </div>

    <div class="form-group">
      <label for="statusParticipation">Statut :</label>
      <select id="statusParticipation" [(ngModel)]="participation.statusParticipation" name="statusParticipation">
        <option *ngFor="let status of ['PENDING', 'CONFIRMED', 'CANCELLED']" [value]="status">{{ status }}</option>
      </select>
    </div>
   
    <div class="form-group">
      <button type="submit">✅ Envoyer la participation</button>
    </div>
  </form>

  <!-- Bouton de retour toujours visible -->
  <div class="form-group">
    <button type="button" (click)="goBack()" class="back-button">
      <i class="fa fa-arrow-left"></i> Retour à la liste
    </button>
  </div>
</div>
