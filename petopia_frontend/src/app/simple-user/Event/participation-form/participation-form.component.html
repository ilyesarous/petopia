<div class="event-form-container">
  <h2>Participer à l'Événement</h2>
  <form (ngSubmit)="onSubmit()">

    <!-- ID Participation -->
    

    <!-- Date d'inscription -->
    <div class="form-group">
      <label for="dateInscription">Date d'inscription :</label>
      <input id="dateInscription" [value]="participation.dateInscription | date:'short'" readonly />
    </div>

    <!-- Événement ID (assigné automatiquement depuis l'event sélectionné) -->
    <div class="form-group">
      <label for="event">ID de l'Événement :</label>
      <input id="event" [value]="participation.event?.idEvent" readonly />
    </div>

 


    <!-- Statut de participation -->
    <div class="form-group">
      <label for="statusParticipation">Statut :</label>
      <select id="statusParticipation" [(ngModel)]="participation.statusParticipation" name="statusParticipation">
        <option *ngFor="let status of ['PENDING', 'APPROVED', 'REJECTED']" [value]="status">{{ status }}</option>
      </select>
    </div>

    <!-- Boutons -->
    <div class="form-group">
      <button type="submit">✅ Envoyer la participation</button>
    </div>
    <div class="form-group">
      <button type="button" (click)="close.emit()">❌ Fermer</button>
    </div>

  </form>
</div>
