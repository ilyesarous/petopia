<!-- xp-bar.component.html -->
<div class="xp-container">
    <div class="xp-info">
      <span class="level">Niveau {{ level }}</span>
      <span class="xp">{{ currentXp }}/{{ level * 100 }} XP</span>
    </div>
    <div class="progress-bar">
      <div class="progress" [style.width.%]="(currentXp / (level * 100)) * 100"></div>
    </div>
  </div>
