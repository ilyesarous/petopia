<div class="container">
    <div class="header">
      <h1>Animal Services</h1>
      <button routerLink="/services/add" class="add-button">Add New Service</button>
    </div>
  
    <div class="filters">
      <input type="text" [(ngModel)]="searchTerm" (input)="filterServices()" placeholder="Search services...">
      
      <select [(ngModel)]="selectedType" (change)="filterServices()">
        <option value="ALL">All Types</option>
        <option *ngFor="let type of serviceTypes" [value]="type">{{type}}</option>
      </select>
    </div>
  
    <div class="services-grid">
      <div *ngFor="let service of filteredServices" class="service-card" [routerLink]="['/services', service.idServiceAnimal]">
        <div class="service-header" [ngClass]="getServiceTypeClass(service.typeService)">
          <h3>{{ service.typeService }}</h3>
        </div>
        <div class="service-body">
          <p>{{ service.descriptionServiceAnimal }}</p>
          <div class="service-details">
            <span class="price">{{ service.prixServiceAnimal }} TND</span>
            <span class="availability" [class.available]="service.disponibilite">
              {{ service.disponibilite ? 'Available' : 'Unavailable' }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
