<div class="rating-container">
    <!-- Header with average rating -->
    <div class="average-rating-section">
      <h2>Your Ratings</h2>
      <div class="average-display">
        <div class="average-value">
          {{averageRating.toFixed(1)}}
          <small>/5</small>
        </div>
        <div class="stars">
          <span *ngFor="let star of getStarArray(averageRating)" 
                [class.filled]="star.filled"
                [class.half]="star.half">★</span>
        </div>
        <div class="total-ratings">{{ratings.length}} rating(s)</div>
      </div>
    </div>
  
    <!-- List of ratings -->
    <div class="ratings-grid" *ngIf="!isLoading; else loading">
      <div *ngIf="ratings.length === 0" class="no-ratings">
        No ratings available yet
      </div>
  
      <div class="rating-card" *ngFor="let rating of ratings">
        <div class="card-content">
          <div class="user-info">
            <div class="avatar" [style.background]="getRandomColor()">
              {{rating.userclientR?.name?.charAt(0)?.toUpperCase() || 'U'}}
            </div>
            <div class="details">
              <h4>{{rating.userclientR?.name || 'Anonymous user'}}</h4>
            </div>
          </div>
  
          <div class="rating-details">
            <div class="stars">
              <span *ngFor="let star of getStarArray(rating.note || 0)" 
                    [class.filled]="star.filled"
                    [class.half]="star.half">★</span>
            </div>
            <p class="comment">{{rating.comment || 'No comment'}}</p>
          </div>
        </div>
      </div>
    </div>
  
    <ng-template #loading>
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading ratings...</p>
      </div>
    </ng-template>
  </div>
