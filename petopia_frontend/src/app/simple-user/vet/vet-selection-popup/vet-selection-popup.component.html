<!-- vet-selection-popup.component.html -->
<div class="vet-selection-dialog">
    <h2 mat-dialog-title class="dialog-title">Select a Veterinarian</h2>
    
    <mat-dialog-content class="dialog-content">
      <div *ngIf="error" class="error-state">
        <div class="error-icon-container">
          <mat-icon class="error-icon">error_outline</mat-icon>
        </div>
        <p class="error-message">{{ error }}</p>
      </div>
  
      <mat-radio-group *ngIf="!isLoading && !error" [(ngModel)]="selectedVetId" class="vet-radio-group">
        <mat-radio-button *ngFor="let vet of vets" [value]="vet.id_user" class="vet-option">
          <div class="vet-card">
            <div class="vet-avatar">
              <mat-icon class="avatar-icon">pets</mat-icon>
            </div>
            <div class="vet-details">
              <h3 class="vet-name">{{ vet.name }}</h3>
              <div class="vet-contact">
                <div class="contact-item">
                  <mat-icon class="contact-icon">email</mat-icon>
                  <span>{{ vet.email }}</span>
                </div>
                <div class="contact-item">
                  <mat-icon class="contact-icon">phone</mat-icon>
                  <span>{{ vet.phoneNumber }}</span>
                </div>
              </div>
            </div>
          </div>
        </mat-radio-button>
      </mat-radio-group>
    </mat-dialog-content>
    
    <mat-dialog-actions class="dialog-actions">
      <button mat-button class="cancel-btn" (click)="close()">Cancel</button>
      <button 
        mat-raised-button 
        class="confirm-btn"
        (click)="selectVet()"
        [disabled]="!selectedVetId">
        Proceed to Payment (50 TND)
      </button>
    </mat-dialog-actions>
  </div>
