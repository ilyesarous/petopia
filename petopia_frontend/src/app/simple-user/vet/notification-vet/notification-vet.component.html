<div class="notification-container">
  <!-- Notification Bell Icon (inchangé) -->
  <div class="relative">
    <button (click)="toggleNotifications()" class="notification-bell">
      <span class="material-icons text-black hover:text-rose">notifications</span>
      <span *ngIf="unreadCount > 0" class="notification-badge">{{unreadCount}}</span>
    </button>
  </div>

  <!-- Notifications Panel -->
  <div *ngIf="showNotifications" class="notification-panel">
    <!-- Overlay -->
    <div class="notification-overlay" (click)="toggleNotifications()"></div>
    
    <!-- Panel Content -->
    <div class="notification-content">
      <!-- Header -->
      <div class="notification-header">
        <h3>Notifications</h3>
        <div class="flex items-center">
          <span *ngIf="unreadCount > 0" class="unread-counter">{{unreadCount}} unread</span>
          <!-- Bouton Add Notification -->
          <button (click)="showAddForm = !showAddForm; $event.stopPropagation()" class="add-button">
            <span class="material-icons text-white hover:text-gray-200">add</span>
          </button>
          <button (click)="toggleNotifications()" class="close-button">
            <span class="material-icons text-white hover:text-gray-200">close</span>
          </button>
        </div>
      </div>

      <!-- Formulaire d'ajout -->
      <div *ngIf="showAddForm" class="add-notification-form">
        <form (ngSubmit)="addNotification()" (click)="$event.stopPropagation()">
          <div class="form-group">
            <label for="notificationMessage">Message:</label>
            <textarea id="notificationMessage" [(ngModel)]="newNotification.message" 
                      name="message" required class="form-textarea"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" (click)="showAddForm = false" class="cancel-button">
              Cancel
            </button>
            <button type="submit" class="submit-button">
              Add Notification
            </button>
          </div>
        </form>
      </div>

      <!-- Notifications List (inchangé) -->
      <div class="notification-list">
        <div *ngFor="let notification of notifications" 
               (click)="markAsRead(notification)"
               class="notification-item"
               [class.unread]="!notification.seen">
            <div class="notification-icon" [ngClass]="{'bg-rose': !notification.seen, 'bg-gray-200': notification.seen}">
              <span *ngIf="!notification.seen" class="material-icons text-white">schedule</span>
              <span *ngIf="notification.seen" class="material-icons text-green-500">check_circle</span>
            </div>
            
            <div class="notification-details">
              <div class="notification-title-row">
                <span class="notification-time">{{getTimeAgo(notification.notif_date)}}</span>
              </div>
              <p class="notification-message">{{notification.message}}</p>
            </div>
            
            <button (click)="deleteNotification(notification.idNotification, $event)" class="delete-button">
              <span class="material-icons text-rose hover:text-rose-700">delete</span>
            </button>
          </div>
          
          <div *ngIf="notifications.length === 0" class="empty-notifications">
            <span class="material-icons text-gray-400">sentiment_neutral</span>
            <p>No notifications yet</p>
          </div>
      </div>
    </div>
  </div>
</div>
