<div class="game">
    <h2 *ngIf="winner" class="winner-message">Winner: {{ winner }}</h2>
    <h2 *ngIf="!winner && squares.includes(null)" class="player-turn">Player: {{ player }}</h2>
    <h2 *ngIf="!winner && !squares.includes(null)" class="draw-message">It's a draw!</h2>
    <app-board [squares]="squares" [xIsNext]="xIsNext" (play)="makeMove($event)"></app-board>
    <button class="new-game-button" (click)="newGame()">New Game</button>
</div>
