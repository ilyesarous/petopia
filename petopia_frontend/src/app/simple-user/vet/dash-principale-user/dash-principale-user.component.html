<div class="dashboard">
    <div class="header">
        <div class="welcome-container">
            <h1 class="welcome-text">Welcome back</h1>
            <div class="right-elements">
                <div class="game-icon" routerLink="/vet/tic-tac-toe">
                    🎮 
                </div>
                <div class="notification-container">
                    <app-notification-vet></app-notification-vet>
                </div>
            </div>
        </div>
    </div>

    <div class="stats-grid-container">
        <div class="stats-row">
            <!-- 1ere ligne (3 cartes) -->
            <div class="stat-card patients" routerLink="/vet/appointment-user">
                <h3>🗓️ Appointment</h3>
                <div class="stat-card patients">Click to view</div>
            </div>
    
            <div class="stat-card appointments" (click)="handlePaymentClick()">
                <h3>💳 Payment</h3>
                <div class="stat-card appointments">Click to pay</div>
            </div>
    
            <div class="stat-card treatments" (click)="redirectToUrlDogBreedRecognition()">
                <h3>🐕 Dog Breed Recognition</h3>
                <div class="stat-card treatments">Click to view</div>
            </div>

        </div>
    </div>

    <div class="pets-section">
        <h2 class="pets-title">My animals</h2>
        
        <div *ngIf="loading" class="loading-message">
            Loading pets...
        </div>

        <div *ngIf="!loading && userPets.length === 0" class="no-pets-message">
            You don't have any pets yet. 
        </div>
        
        <div class="pets-grid">
            <!-- Boucle sur les animaux de l'utilisateur -->
            <div *ngFor="let pet of userPets" class="pet-card" [routerLink]="['/vet/treatment-specific-pets-user', pet.idPet]">
                <div class="pet-image-container">
                    <img [src]="pet.petImage || 'assets/images/logo.png'" [alt]="pet.petName" class="pet-image">
                </div>
                <div class="pet-info">
                    <h3 class="pet-name" style="color: #ff4766;">{{ pet.petName }}</h3>
                    <p class="pet-breed">{{ pet.breed }}</p>
                    <p class="pet-details">{{ pet.petAge }} ans · {{ pet.gender }} </p>
                    <span class="pet-type-badge" style="background-color: #FE9A7A;">{{ pet.species }}</span>
                </div>
            </div>
        </div>
    </div>    
</div>

<app-chatbot></app-chatbot>
