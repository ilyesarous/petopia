<!-- Map Section -->
<div class="map-section">
    <h2 class="welcome-text">Veterinary Locations</h2>
    <div class="map-controls">
        <div *ngIf="selectedLocation" class="selected-location">
            Selected location: {{ selectedLocation }}
        </div>
        <button class="location-button" (click)="locateMe()">
            <i class="fas fa-location-arrow"></i> My Current Location
        </button>
        <button class="add-location-button" (click)="toggleAddingMode()" [class.active]="addingMode">
            <i class="fas fa-map-marker-alt"></i> {{ addingMode ? 'Cancel' : 'Add Location' }}
        </button>
    </div>
    <div id="map"></div>
    <div *ngIf="addingMode" class="adding-mode-info">
        Click on the map to add your veterinary location
    </div>
   
</div>
