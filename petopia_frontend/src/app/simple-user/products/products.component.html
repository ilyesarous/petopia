<div class="container">
  <div class="d-flex">
    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
    <button>search</button>
  </div>
  <div class="row">
    <div class="col-md-3 mt-3" *ngFor="let product of listProducts">
      <div class="card">
        <div class="card-main">
          <div class="discount-wishlist">
            <div class="discount">-9%</div>
            <div class="wishlist"><i class="bi bi-heart fs-4"></i></div>
          </div>
          <div class="label label-green">Pre-Order</div>
          <div class="product-container">
            <div class="p">
              <img src="{{ product.product_image }}" alt="product" />
            </div>
          </div>
          <div class="image">
            <img src="{{ product.product_image }}" alt="image" />
          </div>
          <div class="cart-line"></div>
        </div>
        <div class="content p-3 d-flex flex-column gap-3">
          <div class="d-flex justify-content-between">
            <div class="d-flex flex-column">
              <a href="">{{ product.product_name }}</a>
              <a href="">{{ product.category }}</a>
            </div>
            <div class="rating">
              <i class="bi bi-star"></i>
              <i class="bi bi-star"></i>
              <i class="bi bi-star"></i>
              <i class="bi bi-star"></i>
              <i class="bi bi-star"></i>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <p>
              <span class="price">${{ product.product_price }}</span>
              <span class="old-price">$85.5</span>
            </p>
            <button class="btn"><i class="bi bi-cart fs-4"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
