<div class="community-feed container py-4">
  <div class="position-relative">
    <!-- Left scroll button (optional) -->
    <button class="scroll-btn scroll-left btn" (click)="scrollStories('left')">
      <i class="bi bi-chevron-left"></i>
    </button>
  
    <!-- Stories Container -->
    <div class="stories-slide p-3">
      <!-- "Create Story" card -->
      <div class="story-card create-story" (click)="toggleCreateStory()">
        <div class="story-box">
          <!-- Icon or plus sign for "Create" -->
          <i class="bi bi-plus-circle" style="font-size: 1.5rem;"></i>
        </div>
        <p class="story-owner">Create Story</p>
      </div>
    
      <!-- Loop over stories for actual story cards -->
      <div class="story-card" *ngFor="let story of stories; index as i" (click)="openStoryPopup(i)">
        <!-- Delete icon (only for owner) -->
        <button class="delete-icon" 
                *ngIf="isOwner(story)" 
                (click)="openDeleteConfirmation(story.id); $event.stopPropagation()" 
                title="Delete Story">
          <i class="bi bi-trash"></i>
        </button>
        <div class="story-box">
          <img *ngIf="story.image" [src]="story.image" alt="Story image" />
        </div>
        <p class="story-owner">
          {{ story.user?.name || 'Unknown User' }}
        </p>
      </div>
    </div>
  
    <!-- Right scroll button (optional) -->
    <button class="scroll-btn scroll-right btn" (click)="scrollStories('right')">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
  
    <!-- Story Popup Overlay (for viewing stories) -->
    <div class="story-popup" *ngIf="activeStoryIndex > -1" (click)="closeStoryPopup()">
      <div class="story-popup-content" (click)="$event.stopPropagation()">
        <!-- Progress bar container -->
        <div class="progress-bar">
          <div class="progress" [style.width.%]="progress"></div>
        </div>
        <!-- Header: user info and close -->
        <div class="story-popup-header">
          <span class="story-user">{{ getActiveStory()?.user?.name || 'Unknown User' }}</span>
          <button class="close-popup" (click)="closeStoryPopup()">&times;</button>
        </div>
        <!-- Story image -->
        <img *ngIf="getActiveStory()?.image" [src]="getActiveStory()?.image" alt="Story" />
        <!-- Navigation arrows -->
        <button class="popup-arrow left-arrow" (click)="prevStory($event)"><i class="bi bi-chevron-left"></i></button>
        <button class="popup-arrow right-arrow" (click)="nextStory($event)"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>

  <!-- Create Story Form -->
  <div *ngIf="showCreateStory" class="card mb-3 create-story-form">
    <div class="card-body">
      <h5 class="card-title">Create a Story</h5>
      <!-- Unique id for story file input -->
      <input
        type="file"
        id="storyFileInput"
        (change)="onStoryFileSelected($event)"
        accept="image/*"
        class="form-control"
        hidden
      />
      <label for="storyFileInput" class="btn btn-secondary mb-0">
        <i class="bi bi-image me-1"></i> Add image
      </label>
      <span class="file-name ms-2" *ngIf="selectedStoryFile">
        {{ selectedStoryFileNames }}
      </span>
      <textarea
        class="form-control mt-2"
        placeholder="Add a caption (optional)"
        [(ngModel)]="newStoryText"
      ></textarea>
      <div class="mt-2">
        <button class="btn btn-custom me-2" (click)="createStory()">Post Story</button>
        <button class="btn btn-secondary" (click)="toggleCreateStory()">Cancel</button>
      </div>
    </div>
  </div>


  <!-- Search and sort bar -->
  <div class="mb-3">
    <div class="input-group">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="updatePosts()"
        placeholder="Search by post content or by user"
        class="form-control"
      />
      <button
        class="btn btn-outline-secondary dropdown-toggle"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        Sort by post type
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li *ngFor="let type of postTypes">
          <a
            class="dropdown-item"
            href="#"
            (click)="filterByType(type); $event.preventDefault()"
            >{{ type }}</a
          >
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a
            class="dropdown-item"
            href="#"
            (click)="clearTypeFilter(); $event.preventDefault()"
            >Tous les types</a
          >
        </li>
      </ul>
    </div>
  </div>

  <!-- Create a new post form -->
  <div class="create-post card mb-3">
    <div class="card-body">
      <textarea
        [(ngModel)]="newPostContent"
        class="form-control"
        placeholder="What's on your mind?"
        rows="3"
      ></textarea>
      <!-- Select for Post Type -->
      <select class="form-select mt-2" [(ngModel)]="newPostType">
        <option [ngValue]="PostType.LOST_PET">Lost Pet</option>
        <option [ngValue]="PostType.ADOPTION">Adoption</option>
        <option [ngValue]="PostType.GENERAL">General</option>
        <option [ngValue]="PostType.ADVICE">Advice</option>
        <option [ngValue]="PostType.FOR_SALE">For Sale</option>
      </select>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <div class="file-input-container">
          <input
            type="file"
            id="fileInput"
            (change)="onFileSelected($event)"
            accept="image/*"
            multiple
            hidden
          />
          <label for="fileInput" class="btn btn-secondary mb-0">
            <i class="bi bi-image me-1"></i> Add image(s)
          </label>
          <span class="file-name ms-2" *ngIf="selectedFiles && selectedFiles.length">
            {{ selectedFileNames }}
          </span>
        </div>
        <button class="btn btn-custom" (click)="createPost()">Post</button>
      </div>
    </div>
  </div>

  <!-- List of posts -->
  <div class="row">
    <div class="col-12 mb-3" *ngFor="let post of posts">
      <app-post [post]="post"></app-post>
    </div>
  </div>
  <div class="modal fade custom-modal" 
       [class.show]="showDeleteConfirmation" 
       [style.display]="showDeleteConfirmation ? 'block' : 'none'" 
       tabindex="-1" 
       role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Story Deletion</h5>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete this story?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="cancelDelete()">Cancel</button>
          <button type="button" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
