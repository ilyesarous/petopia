<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Pet News ( by petmd.com )</h2>
    </div>
  
    <div *ngIf="loading">Loading news...</div>
  
    <div class="row" *ngIf="!loading && paginatedNews.length > 0">
      <div class="col-md-4 mb-4" *ngFor="let news of paginatedNews">
        <div class="card h-100 shadow-sm">
          <img [src]="news.imageUrl" class="card-img-top" *ngIf="news.imageUrl" alt="News Image" />
          <div class="card-body">
            <h5 class="card-title">{{ news.title }}</h5>
            <p class="card-text">{{ news.description }}</p>
            <div class="news-buttons">
              <a [href]="news.url" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-news-link">
                Read More
              </a>
              
                <button class="btn btn-sm btn-news-share" (click)="shareAsPost(news)">
                  <i class="bi bi-megaphone-fill"></i> Share
                </button>
              </div>
              
        </div>
        </div>
      </div>
    </div>
  
    <div *ngIf="!loading && newsList.length === 0">
      <p>News will be available soon.</p>
    </div>
  
    <div class="pagination-controls text-center mt-4" *ngIf="totalPages > 1">
      <button class="btn btn-sm mx-1" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
        Prev
      </button>
      <button
        *ngFor="let page of [].constructor(totalPages); let i = index"
        class="btn btn-sm mx-1"
        [class.active]="currentPage === (i + 1)"
        (click)="changePage(i + 1)">
        {{ i + 1 }}
      </button>
      <button class="btn btn-sm mx-1" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
        Next
      </button>
    </div>
  </div>
