<div class="adoption-requests-container container">
    <h2 class="title">Adoption Requests</h2>
  <!-- Filter Section -->
   <!-- Filter & Search Section -->
    <div class="filter-container">

        <div class="filter-bar">
            <div class="search-group">
                <input
                    type="text"
                    placeholder="Search by user or pet name"
                    [(ngModel)]="searchText"
                    (input)="applyFilter()"
                />
                </div>
            <div class="filter-group">
            <label for="statusFilter">Filter by Status:</label>
            <select id="statusFilter" [(ngModel)]="selectedStatus" (change)="applyFilter()">
                <option value="">All</option>
                <option value="PENDING">Pending</option>
                <option value="APPROVED">Approved</option>
                <option value="REJECTED">Rejected</option>
            </select>
            </div>
        
            
        </div>
    </div>
  
  <!-- Status Tag -->
  <div class="active-filter-tag" *ngIf="selectedStatus">
    {{ selectedStatus }}
    <span class="remove-tag" (click)="clearStatus()">✕</span>
  </div>
  
    
    <div class="request-card" *ngFor="let req of adoptionRequests">
      <!-- Left: Pet Image -->
      <div class="pet-image">
        <img [src]="req.pet.petImage || 'https://via.placeholder.com/100'" [alt]="req.pet.petName" />
      </div>
  
      <!-- Center: Info -->
      <div class="request-info-section">
        <div class="user-info">
            <p class="user-name">
                {{ req.pet.petName | titlecase }}
            </p>
            <p class="pet-name">User: <strong>{{ req.requester.name| titlecase }}</strong></p>
          <p class="motivation-text">"{{ req.motivation_letter | slice:0:120 }}..."</p>
          <a class="details-link" (click)="goToDetails(req.id_request)">See Details</a>
        </div>
      </div>
      
  
      <!-- Right: Buttons -->
      <div class="action-buttons"  *ngIf="req.status === 'PENDING'">
        <button class="btn approve-btn" (click)="approveRequest(req)">Approve</button>
        <button class="btn reject-btn" (click)="rejectRequest(req)">Reject</button>
      </div>
    </div>


    <div class="pagination-controls text-center mt-4" *ngIf="totalPages > 1">
        <button class="btn btn-sm mx-1" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">Prev</button>
        
        <button 
          *ngFor="let page of pageNumbers" 
          class="btn btn-sm mx-1" 
          [class.active]="currentPage === page" 
          (click)="changePage(page)">
          {{ page }}
        </button>
      
        <button class="btn btn-sm mx-1" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">Next</button>
      </div>
      
  </div>
