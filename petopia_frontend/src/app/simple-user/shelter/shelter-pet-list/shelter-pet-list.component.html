<!-- src/app/simple-user/shelter/shelter-pet-list/shelter-pet-list.component.html -->
<div *ngIf="alertMessage" class="alert" [ngClass]="alertClass" role="alert">
  {{ alertMessage }}
</div>
<div class="pet-list-container container">
    <h2 class="text-center my-4">{{ shelter?.shelter_name }}'s Pets</h2>

    <div class="text-end mb-4">
      <button class="btn add-btn" (click)="openAddModal()">+ Add New Pet</button>
    </div>
    

    <div class="row">
      <div class="search-filter-wrapper">
        <div class="search-box">
          <input
            type="text"
            class="search-input"
            placeholder="Search pets..."
            [(ngModel)]="searchQuery"
            (input)="applyFilters()"
          />
        </div>
      
        <div class="filter-buttons">
          <button
            class="filter-btn"
            [class.active]="statusFilter === 'ALL'"
            (click)="statusFilter = 'ALL'; applyFilters()"
          >All</button>
          <button
            class="filter-btn"
            [class.active]="statusFilter === 'AVAILABLE'"
            (click)="statusFilter = 'AVAILABLE'; applyFilters()"
          >Available</button>
          <button
            class="filter-btn"
            [class.active]="statusFilter === 'ADOPTED'"
            (click)="statusFilter = 'ADOPTED'; applyFilters()"
          >Adopted</button>
        </div>
      
      </div>
      

      <div *ngFor="let pet of paginatedPets" class="col-md-4 mb-4">
        <div class="shelter-pet-card">
            <div class="pet-image-wrapper">
              <img src="{{ pet.petImage || 'https://via.placeholder.com/150' }}" alt="{{ pet.petName }}" />
              <div class="status-label" [ngClass]="getStatusClass(pet.status)">
                {{ pet.status }}
              </div>
            </div>
            <div class="pet-info">
              <h3 class="pet-name">{{ pet.petName }}</h3>
              <p class="pet-details">
                A {{ pet.species }} of breed {{ pet.breed }} that is 
                {{ pet.petAge }} years old and {{ pet.gender }}.
                
                <br>
                Health: {{ pet.healthStatus }}
              </p>
              <div class="pet-actions">
                <button class="btn edit-btn" (click)="openEditModal(pet)">Edit</button>
                <button class="btn delete-btn" (click)="deletePet(pet)">Delete</button>
              </div>
            </div>
          </div>
          
      </div>
    </div>
    <div class="pagination-controls" *ngIf="pageNumbers.length > 1">
      <button class="page-btn" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">Prev</button>
  
      <ng-container *ngFor="let page of pageNumbers">
        <button
          class="page-btn"
          [class.active]="page === currentPage"
          (click)="changePage(page)"
        >
          {{ page }}
        </button>
      </ng-container>
  
      <button
        class="page-btn"
        [disabled]="currentPage === pageNumbers.length"
        (click)="changePage(currentPage + 1)"
      >
        Next
      </button>
    </div>
  
  </div>
  <!-- Edit Pet Modal -->
<div class="modal-overlay" *ngIf="showEditModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Pet Information</h3>
        <button type="button" class="close-btn" (click)="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form [formGroup]="editPetForm" (ngSubmit)="onEditSubmit()">
          <div class="form-group">
            <label for="petName">
              <fa-icon [icon]="faPaw" class="me-2"></fa-icon>Pet Name
            </label>
            <input type="text" id="petName" formControlName="petName" class="form-control" />
          </div>
          <div class="form-group">
            <label for="breed">Breed</label>
            <input type="text" id="breed" formControlName="breed" class="form-control" />
          </div>
          <div class="form-group">
            <label for="petAge">Age</label>
            <input type="number" id="petAge" formControlName="petAge" class="form-control" />
          </div>
          <div class="form-group">
            <label for="species">Species</label>
            <select id="species" formControlName="species" class="form-control">
              <option value="DOG">Dog</option>
              <option value="CAT">Cat</option>
            </select>
          </div>

          <div class="form-group">
            <label for="healthStatus">Health Status</label>
            <input type="text" id="healthStatus" formControlName="healthStatus" class="form-control" />
          </div>
          <div class="form-group">
            <label for="editImage">Pet Image</label>
            <input type="file" class="form-control" (change)="onEditImageSelected($event)" />
          </div>
          
          <!-- Image Preview -->
          <div class="form-group image-preview-container" *ngIf="editImagePreviewUrl || selectedPet?.petImage">
            <label>Current / New Preview</label>
            <div class="image-preview-wrapper">
              <img [src]="editImagePreviewUrl || selectedPet?.petImage" alt="Preview" />
            </div>
          </div>
          
          
          <div class="modal-actions">
            <button type="submit" class="btn save-btn" [disabled]="editPetForm.invalid">Save Changes</button>
            <button type="button" class="btn cancel-btn" (click)="closeEditModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
 <!-- Add Pet Modal -->
<div class="modal-overlay" *ngIf="showAddModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add New Pet</h3>
      <button type="button" class="close-btn" (click)="closeAddModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form [formGroup]="addPetForm" (ngSubmit)="onAddSubmit()" enctype="multipart/form-data">
        <div class="form-group">
          <label for="petName"><fa-icon [icon]="faPaw"></fa-icon> Pet Name</label>
          <input type="text" id="petName" formControlName="petName" class="form-control" />
        </div>
        <div class="form-group">
          <label for="breed">Breed</label>
          <input type="text" id="breed" formControlName="breed" class="form-control" />
        </div>
        <div class="form-group">
          <label for="petAge">Age</label>
          <input type="number" id="petAge" formControlName="petAge" class="form-control" />
        </div>
        <div class="form-group">
          <label for="species">Species</label>
          <select id="species" formControlName="species" class="form-control">
            <option value="DOG">Dog</option>
            <option value="CAT">Cat</option>
          </select>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" formControlName="gender" class="form-control">
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label for="size">Size</label>
          <select id="size" formControlName="size" class="form-control">
            <option value="SMALL">Small</option>
            <option value="MEDIUM">Medium</option>
            <option value="LARGE">Large</option>
          </select>
        </div>
        <div class="form-group">
          <label for="healthStatus">Health Status</label>
          <input type="text" id="healthStatus" formControlName="healthStatus" class="form-control" />
        </div>
        <div class="form-group">
          <label for="image">Pet Image</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
            <div class="form-group image-preview-container" *ngIf="imagePreviewUrl">
              <label>Preview</label>
              <div class="image-preview-wrapper">
                <img [src]="imagePreviewUrl" alt="Pet Preview" />
              </div>
            </div>
          
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn save-btn" [disabled]="addPetForm.invalid || !selectedImage">Add Pet</button>
          <button type="button" class="btn cancel-btn" (click)="closeAddModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
