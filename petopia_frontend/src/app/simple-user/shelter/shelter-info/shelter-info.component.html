<div class="account-settings-container">
  <!-- New Container for the Logo on the Left -->
  <div class="logo-container">
    <div class="profile-picture">
      <!-- Dynamically change the logo when a new file is selected -->
      <img *ngIf="logoPreviewUrl || shelterData.logoUrl" [src]="logoPreviewUrl || shelterData.logoUrl" alt="Shelter Logo" class="logo-img" />
      <input type="file" id="file" hidden (change)="onLogoChange($event)">
      <label for="file" class="change-picture-btn" *ngIf="isEditing">Upload new logo</label>
    </div>
  </div>

  <!-- Main Settings Form on the Right -->
  <div class="settings-main">
    <h2 class="title">Shelter Information</h2>

    <div class="info-form" *ngIf="shelterForm" [formGroup]="shelterForm">
      <div class="info-group">
        <label>Shelter Name</label>
        <input formControlName="shelter_name" [readonly]="!isEditing" placeholder="{{ shelterData!.shelter_name }}" />
        <fa-icon *ngIf="isEditing" [icon]="faPen" class="me-2 icon-pen"></fa-icon>
        <!-- Error message below the input field -->
        <div *ngIf="shelterForm.get('shelter_name')?.invalid && shelterForm.get('shelter_name')?.touched" class="error-message">
          Shelter Name is required.
        </div>
      </div>

      <div class="info-group">
        <label>Email</label>
        <input formControlName="email" [readonly]="!isEditing" />
        <fa-icon *ngIf="isEditing" [icon]="faPen" class="me-2 icon-pen"></fa-icon>
        <!-- Error message below the input field -->
        <div *ngIf="shelterForm.get('email')?.invalid && shelterForm.get('email')?.touched" class="error-message">
          Please enter a valid email.
        </div>
      </div>

      <div class="info-group">
        <label>Phone Number</label>
        <input formControlName="phone_number" [readonly]="!isEditing" />
        <fa-icon *ngIf="isEditing" [icon]="faPen" class="me-2 icon-pen"></fa-icon>
        <!-- Error message below the input field -->
        <div *ngIf="shelterForm.get('phone_number')?.invalid && shelterForm.get('phone_number')?.touched" class="error-message">
          Please enter a valid 10-digit phone number.
        </div>
      </div>

      <div class="info-group">
        <label>Description</label>
        <textarea formControlName="description" [readonly]="!isEditing"></textarea>
        <fa-icon *ngIf="isEditing" [icon]="faPen" class="me-2 icon-pen"></fa-icon>
        <!-- Error message below the input field -->
        <div *ngIf="shelterForm.get('description')?.invalid && shelterForm.get('description')?.touched" class="error-message">
          Description must be at least 10 characters long.
        </div>
      </div>

      <div class="info-group">
        <label>Website</label>
        <input formControlName="website" [readonly]="!isEditing" />
        <fa-icon *ngIf="isEditing" [icon]="faPen" class="me-2 icon-pen"></fa-icon>
        <!-- Error message below the input field -->
        <div *ngIf="shelterForm.get('website')?.invalid && shelterForm.get('website')?.touched" class="error-message">
          Please enter a valid URL.
        </div>
      </div>

      <div class="actions">
        <button class="btn-edit" (click)="enableEdit()" *ngIf="!isEditing">Modify</button>
        <button class="btn-update" (click)="onSubmit()" *ngIf="isEditing">Update</button>
        <button class="btn-cancel" (click)="cancelEdit()" *ngIf="isEditing">Cancel</button>
      </div>

      <div class="alert" *ngIf="alertMessage" [ngClass]="'alert-' + alertType">
        {{ alertMessage }}
      </div>
    </div>
  </div>
</div>
