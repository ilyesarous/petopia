<div class="container">
  <div class="search-icons-container">
    <div style="width: 60px"></div>
    <!-- Search Box (left side) -->
    <div class="search-container" style="flex-grow: 1; max-width: 800px">
      <div class="search-box">
        <i class="bi bi-search search-icon"></i>
        <input
          class="form-control search-input"
          type="text"
          placeholder="Search for products..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
        />
        <button class="search-btn" (click)="onSearch()">Search</button>
      </div>
      <div class="search-tags mt-2" *ngIf="recentSearches.length > 0">
        <span class="search-tags-label">Recent searches:</span>
        <span
          class="search-tag"
          *ngFor="let term of recentSearches"
          (click)="applySearch(term)"
        >
          {{ term }}
          <i class="bi bi-x" (click)="removeRecentSearch(term, $event)"></i>
        </span>
      </div>
    </div>

    <!-- Icons Container (right side) -->
    <div class="icons-container">
      <button class="icon-btn" (click)="addNewProduct()" title="add">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button class="icon-btn" (click)="viewFavorites()" title="Favorites">
        <i class="bi bi-heart"></i>
        <span class="icon-badge" *ngIf="favoriteCount > 0">
          {{ favoriteCount }}
        </span>
      </button>
      <button class="icon-btn" (click)="viewCart()" title="Cart">
        <i class="bi bi-cart"></i>
        <span class="icon-badge" *ngIf="cartItemCount > 0">
          {{ cartItemCount }}
        </span>
      </button>
    </div>
  </div>

  <!-- Caroussel -->
  <div class="row mt-4">
    <div class="col-md-12">
      <app-carousel></app-carousel>
    </div>
  </div>
  <!-- Brands -->
  <div class="row mt-4 mb-5">
    <div class="col-md-12">
      <app-brands></app-brands>
    </div>
  </div>

  <!-- Best Sellers -->

  <div class="row mt-4" *ngIf="bestSeller.length !=0">
    <h2 class="mb-4">Best Sellers</h2>
    <div
      class="col-md-3 mt-3"
      *ngFor="let product of bestSeller"
    >
      <app-product-card [product]="product"></app-product-card>
    </div>
  </div>

  <!-- Products -->
  <div *ngIf="searchQuery.length == 0">
    <div class="row mb-5" *ngFor="let category of categories">
      <h2 class="my-4" *ngIf="category.items.length != 0">{{ category.titel }}</h2>
      <div
        class="col-md-3 mt-3"
        *ngFor="let product of getPaginatedItems(category)"
      >
        <app-product-card [product]="product"></app-product-card>
      </div>
      <!-- Custom Horizontal Pagination -->
      <div
        *ngIf="category.items.length > itemsPerPage"
        class="horizontal-pagination"
      >
        <button
          class="page-nav"
          (click)="prevPage(category)"
          [disabled]="category.currentPage === 1"
        >
          <i class="bi bi-chevron-left"></i>
        </button>

        <div class="page-numbers">
          <button
            *ngFor="let page of getPages(category)"
            [class.active]="page === category.currentPage"
            (click)="setPage(category, page)"
          >
            {{ page }}
          </button>
        </div>

        <button
          class="page-nav"
          (click)="nextPage(category)"
          [disabled]="category.currentPage === getTotalPages(category)"
        >
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
  <div *ngIf="searchQuery.length > 0">
    <div class="row">
      <h2 class="mb-4">Searched Product</h2>
      <div class="col-md-3 mt-3" *ngFor="let product of filteredProducts">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </div>
  </div>
  <!-- No results message -->
  <div
    *ngIf="filteredProducts.length === 0 && searchQuery"
    class="col-12 text-center py-5"
  >
    <h4>No products found for "{{ searchQuery }}"</h4>
    <button class="btn btn-link" (click)="clearSearch()">Clear search</button>
  </div>

  <!-- Add Product Modal -->
  <div class="modal" *ngIf="showAddProductModal">
    <div class="modal-content">
      <span class="close" (click)="closeModal()">&times;</span>
      <app-add-product
        *ngIf="showAddProductModal"
        [product]="currentProduct"
        [isEditMode]="isEditMode"
        (productAdded)="handleProductAdded($event)"
        [role]="role"
        (cancel)="closeModal()"
      >
      </app-add-product>
    </div>
  </div>
</div>
