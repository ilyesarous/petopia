<div class="carousel">
    <div class="slide" [style.background-image]="'url(' + slides[currentSlide].imageUrl + ')'">
      
    </div>
    
    <button class="carousel-control prev" (click)="prev()"><i class="bi bi-caret-left"></i></button>
    <button class="carousel-control next" (click)="next()"><i class="bi bi-caret-right"></i></button>
    
    <div class="indicators">
      <span *ngFor="let slide of slides; let i = index" 
            [class.active]="i === currentSlide"
            (click)="currentSlide = i"></span>
    </div>
  </div>
