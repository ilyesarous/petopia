<div class="stories-preview-container">
    <!-- Individual Story Circle -->
    <div class="story-circle" *ngFor="let story of stories; let i = index">
      <div class="story-border">
        <img [src]="story.image" [alt]="story.name" class="story-image">
      </div>
      <span class="story-username">{{story.name}}</span>
    </div>
  </div>
