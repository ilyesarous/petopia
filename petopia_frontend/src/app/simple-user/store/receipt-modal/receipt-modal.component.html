<!-- receipt-modal.component.html -->
<div class="modal-overlay" *ngIf="true">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Order Receipt</h2>
        <button class="close-btn" (click)="onClose()"><i class="bi bi-x-lg"></i></button>
      </div>
      
      <div class="modal-body" id="receipt-content">
        <div class="receipt-details">
          <p><strong>Date:</strong> {{ today | date:'medium' }}</p>
          <p><strong>Order ID:</strong> {{ cart.cart_id }}</p>
        </div>
        
        <div class="receipt-container">
          <table class="receipt-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of cartItems">
                <td>{{ item.product.product_name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.product.product_price }} TND</td>
                <td>{{ item.product.product_price * item.quantity }} TND</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="receipt-total">
          <h3>Total: {{ cart.total_price }} TND</h3>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-cancel" (click)="onClose()">Cancel</button>
        <button class="btn btn-proceed" (click)="onProceed()">Proceed to Payment</button>
      </div>
    </div>
  </div>
