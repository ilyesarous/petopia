<div class="product-card">
  <div class="card-header">
    <div *ngIf="product.cuppon_price != 0" class="discount-badge">
      -{{ product.cuppon_price }}%
    </div>
    <button class="wishlist-btn" (click)="toggleWishlist()">
      <i class="bi bi-heart{{ product.liked ? '-fill' : '' }}"></i>
    </button>
  </div>

  <div class="product-image-container"(click)="showProductDetails(product.product_id)">
    <img
      [src]="product.product_image"
      [alt]="product.product_name"
      class="main-image"
    />
    <div class="hover-thumbnail">
      <img [src]="product.product_image" [alt]="product.product_name" />
    </div>
  </div>

  <div class="card-body">
    <div class="product-info">
      <h3 class="product-name">{{ product.product_name }}</h3>
      <div class="pre-order-badge">Pre-Order</div>
      <span class="product-category">{{ product.category }}</span>

      <div class="rating">
        <i
          *ngFor="let star of [1, 2, 3, 4, 5]"
          class="bi bi-star{{ star <= (product.rating || 0) ? '-fill' : '' }}"
        ></i>
      </div>
    </div>

    <div class="price-section">
      <div class="prices">
        <span class="current-price">${{ product.product_price }}</span>
        <span *ngIf="product.cuppon_price" class="original-price"
          >${{product.old_price}}</span
        >
      </div>
      <button class="add-to-cart">
        <i class="bi bi-cart-plus"></i>
      </button>
    </div>
  </div>
</div>
