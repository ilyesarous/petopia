<br>
<div class="dashboard-container">
  <div *ngIf="user?.ourUsers; else loading" class="dashboard-card user-profile">
    <div class="card-body">
      <div class="profile-header">
        <div class="avatar-container">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSppkoKsaYMuIoNLDH7O8ePOacLPG1mKXtEng&s"
               alt="User Avatar"
               class="user-avatar">
          <div class="avatar-status" [ngClass]="user.ourUsers.enabled ? 'active' : 'locked'"></div>
        </div>

        <h2 class="user-name">
          {{ user.ourUsers.name }}
        </h2>

        <div class="user-badge">
          <i class="fas fa-star"></i>
          {{ user.ourUsers.nb_points }} Points
        </div>
      </div>

      <div class="user-info">
        <div class="info-item">
          <div class="info-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <div class="info-content">
            <div class="info-label">Email</div>
            <div class="info-value">{{ user.ourUsers.email }}</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <i class="fas fa-phone"></i>
          </div>
          <div class="info-content">
            <div class="info-label">Phone</div>
            <div class="info-value">{{ user.ourUsers.phoneNumber }}</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <i class="fas fa-info-circle"></i>
          </div>
          <div class="info-content">
            <div class="info-label">Status</div>
            <div class="info-value status" [ngClass]="user.ourUsers.enabled ? 'active' : 'locked'">
              {{ user.ourUsers.enabled ? 'Active' : 'Inactive' }}
            </div>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button (click)="isPanelOpen = true" class="action-button edit-button">
          <i class="fas fa-edit"></i> Edit Profile
        </button>

        <button routerLink="/change-password" class="action-button password-button">
          <i class="fas fa-key"></i> Change Password
        </button>
      </div>
    </div>
  </div>
  <br>
  <br>
  <ng-template #loading>
    <div class="dashboard-card loading-card">
      <div class="card-body">
        <div class="loading-spinner">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Loading user data...</p>
        </div>
      </div>
    </div>
  </ng-template>
</div>

<div class="side-panel" [class.open]="isPanelOpen">
  <div class="side-panel-content">
    <button class="close-btn" (click)="isPanelOpen = false">&times;</button>
    <app-edit-profile-panel></app-edit-profile-panel>
  </div>
</div>
