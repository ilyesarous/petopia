<div class="content-area">
  <!-- Recent Signups Section -->
  <div class="dashboard-card">
    <div class="card-header">
      <h2><i class="fas fa-user-plus"></i> Recent Signups</h2>
      <button (click)="clearNotifications()" class="btn-clear">Clear All</button>
    </div>

    <div *ngIf="notifications.length === 0" class="empty-state">
      <i class="fas fa-user-slash"></i>
      <p>No recent signups</p>
    </div>

    <div *ngFor="let notification of notifications" class="notification-item">
      <div class="user-avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="notification-content">
        <h4>{{ notification.name }}</h4>
        <p class="user-email">{{ notification.email }}</p>
        <p class="signup-time">{{ notification.timestamp | date:'medium' }}</p>
      </div>
    </div>
  </div>
  <br>
<div class="users-list-container">

  <div class="section-header">
    <h3><i class="fas fa-users"></i> Users Management</h3>
    <div class="search-container">
      <input type="text" class="search-input" placeholder="Search users..." [(ngModel)]="searchTerm" />
      <button class="search-btn"><i class="fas fa-search"></i></button>
    </div>

    <div class="header-actions">
      <button class="refresh-btn" (click)="refreshUsers()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>

  </div>

  <div *ngIf="filteredUsers.length > 0" class="users-table-container">
    <div class="table-responsive">
      <table class="users-table">
        <thead>
        <tr>
          <th>Email</th>
          <th>Status</th>
          <th>Points</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td data-label="Email">{{ user.email }}</td>
          <td data-label="Status">
              <span [class]="'status-badge ' + (user.locked ? 'locked' : 'active')">
                {{ user.locked ? 'Locked' : 'Active' }}
              </span>
          </td>
          <td data-label="Points">
            <span class="points-badge">{{ user.nb_points }}</span>
          </td>
          <td data-label="Actions" class="actions-cell">
            <button class="action-btn view" (click)="viewUserDetails(user)">
              <i class="fas fa-eye"></i>
            </button>
            <button class="action-btn delete" (click)="deleteUser(user.id)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="filteredUsers.length === 0" class="empty-state">
    <i class="fas fa-user-slash"></i>
    <p>No users found</p>
  </div>
</div>
