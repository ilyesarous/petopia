<div class="dashboard-container">

  <div *ngIf="pets.length > 0; else noPets" class="dashboard-cards">
    <div class="dashboard-card pet-card" *ngFor="let pet of pets">
      <div class="card-header">
        <h3>{{ pet.petName}}</h3>
        <i class="fas fa-paw"></i>
      </div>

      <div class="card-body">
        <img *ngIf="pet.petImage"
             [src]="pet.petImage"
             class="pet-image">

        <div class="pet-stats">
          <div class="stat-item">
            <span class="stat-label">Species</span>
            <span class="stat-value">{{ pet.species }}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Breed</span>
            <span class="stat-value">{{ pet.breed }}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Age</span>
            <span class="stat-value">{{ pet.petAge }} years</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Gender</span>
            <span class="stat-value">{{ pet.gender }}</span>
          </div>
          <div class="stat-item" *ngIf="pet.size">
            <span class="stat-label">Size</span>
            <span class="stat-value">{{ pet.size }}</span>
          </div>
          <div class="stat-item" *ngIf="pet.location">
            <span class="stat-label">Location</span>
            <span class="stat-value">{{ pet.location }}</span>
          </div>
        </div>

        <div class="status-badge" [ngClass]="{
          'available': pet.status === 'AVAILABLE',
          'adopted': pet.status === 'ADOPTED',
          'pending': pet.status === 'PENDING'
        }">
          <i *ngIf="pet.status === 'AVAILABLE'" class="fas fa-check-circle"></i>
          <i *ngIf="pet.status === 'ADOPTED'" class="fas fa-heart"></i>
          <i *ngIf="pet.status === 'PENDING'" class="fas fa-hourglass-half"></i>
          {{ pet.status | titlecase }}
        </div>

        <button (click)="deletePet(pet.idPet)" class="card-button delete-button">
          <i class="fas fa-trash"></i> Delete Pet
        </button>
      </div>
    </div>
  </div>

  <ng-template #noPets>
    <div class="dashboard-card empty-state">
      <div class="card-body">
        <i class="fas fa-paw"></i>
        <p>No pets available at the moment.</p>
        <button *ngIf="!isAdmin" routerLink="/pet" class="card-button">
          <i class="fas fa-plus"></i> Add New Pet
        </button>
      </div>
    </div>
  </ng-template>
</div>
