<div class="users-list-container">
  <div *ngIf="reclamations.length > 0">
    <div class="section-header">
      <h3><i class="fas fa-list"></i>Reclamations</h3>
      <div class="header-actions">
        <button class="refresh-btn">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
        <button class="export-btn">
          <i class="fas fa-file-export"></i> Export
        </button>
      </div>
    </div>

    <div class="users-table-container">
      <table class="users-table">
        <thead>
        <tr>
          <th>Title</th>
          <th>Description</th>
          <th>Status</th>
          <th>Created At</th>
          <th>Reported By</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let reclamation of reclamations">
          <td>{{ reclamation.title }}</td>
          <td>{{ reclamation.description }}</td>
          <td>
              <span class="status-badge" [ngClass]="{
                'active': reclamation.status === 'RESOLVED',
                'locked': reclamation.status === 'PENDING',
                'in-progress': reclamation.status === 'IN_PROGRESS'
              }">
                {{ reclamation.status }}
              </span>
          </td>
          <td>{{ reclamation.createdAt | date: 'medium' }}</td>
          <td>{{ reclamation.username }}</td>
          <td class="actions-cell">
            <button class="action-btn delete" (click)="deleteReclamation(reclamation.id)">
              <i class="fas fa-trash"></i>
            </button>
            <button class="action-btn update" (click)="respondToReclamation(reclamation)">
              <i class="fas fa-reply"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="reclamations.length === 0" class="empty-state">
    <i class="fas fa-inbox"></i>
    <p>No reclamations found.</p>
    <button class="add-user-btn">
      <i class="fas fa-plus"></i> soon
    </button>
  </div>
</div>
